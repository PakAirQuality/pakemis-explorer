# PakEmis Explorer API -> the Cloud Run service `pakemis` (modelled on hawanama-main/cloudbuild.yaml).
#
#     make push-release BUCKET=<bucket>                     # once per release: the payload + tiles to GCS
#     gcloud builds submit --config cloudbuild.yaml \
#         --substitutions _RELEASES_BUCKET=<bucket>,_RELEASE_VERSION=1.0.0rc42,_ALLOWED_ORIGINS=https://<site>.web.app .
#
# The image carries the API and the vendored query core only; on start the service pulls
# gs://${_RELEASES_BUCKET}/releases/${_RELEASE_VERSION}/ and verifies it (api/start.sh), so the
# runtime service account needs roles/storage.objectViewer on the bucket. GEMINI_API_KEY comes from
# Secret Manager. Firebase Hosting rewrites /api/v1/emissions/** to this service (firebase.json).
substitutions:
  _REGION: asia-south1
  _RELEASES_BUCKET: pakemis-releases
  _RELEASE_VERSION: 1.0.0rc59
  _ALLOWED_ORIGINS: https://pakemis.web.app
  # The sign-in gate (api/pakemis_api/auth.py). Empty _REQUIRE_AUTH deploys the open API this
  # repository's default is; "firebase" serves only holders of a token from _AUTH_PROJECT whose
  # address is in _AUTH_DOMAINS or _AUTH_EMAILS - what an internal deployment wants, and what
  # keeps the assistant's key spendable by staff alone.
  _REQUIRE_AUTH: ""
  _AUTH_PROJECT: ""
  _AUTH_DOMAINS: ""
  _AUTH_EMAILS: ""

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'api/Dockerfile'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/pakemis:latest'
      - '.'
    env:
      - 'DOCKER_BUILDKIT=1'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/pakemis:latest'

  # Public read API (no partner key: the emissions API is public, read-only, receipt-bearing).
  # ^|^ makes | the list separator so _ALLOWED_ORIGINS may itself be a comma list.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'pakemis'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/pakemis:latest'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest'
      - '--set-env-vars=^|^PAKEMIS_RELEASES_BUCKET=${_RELEASES_BUCKET}|PAKEMIS_RELEASE_VERSION=${_RELEASE_VERSION}|ALLOWED_ORIGINS=${_ALLOWED_ORIGINS}|PAKEMIS_ASK_PROVIDER=gemini|PAKEMIS_REQUIRE_AUTH=${_REQUIRE_AUTH}|PAKEMIS_AUTH_PROJECT=${_AUTH_PROJECT}|PAKEMIS_AUTH_DOMAINS=${_AUTH_DOMAINS}|PAKEMIS_AUTH_EMAILS=${_AUTH_EMAILS}'
      - '--cpu=2'
      - '--memory=2Gi'
      - '--concurrency=20'
      - '--timeout=300'
      # SCALE TO ZERO (2026-09-18, the operator's call): nothing is billed while nobody is
      # reading, and the first reader after an idle period waits for the whole start - measured at
      # about 35 s on the running revision: 6 s to pull the 239 MB payload from the bucket, 12 s to
      # verify every digest, 15 s to load the release and listen. Cloud Run's request timeout (300 s
      # below) covers it and the app's own loading screen covers the wait. Set this to 1 to keep an
      # instance warm instead, at roughly $25-35 a month; baking the payload into the image would
      # cut most of the 35 s if both were ever wanted at once.
      - '--min-instances=0'
      - '--max-instances=4'

options:
  machineType: 'E2_HIGHCPU_8'
