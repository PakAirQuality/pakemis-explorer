# PakEmis Explorer API -> the Cloud Run service `pakemis` (modelled on hawanama-main/cloudbuild.yaml).
#
#     make push-release BUCKET=<bucket>                     # once per release: the payload + tiles to GCS
#     gcloud builds submit --config cloudbuild.yaml \
#         --substitutions _RELEASES_BUCKET=<bucket>,_RELEASE_VERSION=1.0.0rc42 .
#
# The image carries the API and the vendored query core only; on start the service pulls
# gs://${_RELEASES_BUCKET}/releases/${_RELEASE_VERSION}/ and verifies it (api/start.sh), so the
# runtime service account needs roles/storage.objectViewer on the bucket. GEMINI_API_KEY comes from
# Secret Manager. Firebase Hosting rewrites /api/v1/emissions/** to this service (firebase.json).
substitutions:
  _REGION: asia-south1
  _RELEASES_BUCKET: pakemis-releases
  _RELEASE_VERSION: 1.0.0rc59
  # the public address and the site's own *.web.app name (the same Hosting site answers both)
  _ALLOWED_ORIGINS: https://emissions.hawanama.org,https://pakemis.web.app
  # The sign-in gate (api/pakemis_api/auth.py). Empty _REQUIRE_AUTH deploys the open API this
  # repository's default is; "firebase" serves only holders of a token from _AUTH_PROJECT whose
  # address is in _AUTH_DOMAINS or _AUTH_EMAILS - what an internal deployment wants, and what
  # keeps the assistant's key spendable by staff alone.
  _REQUIRE_AUTH: ""
  _AUTH_PROJECT: ""
  _AUTH_DOMAINS: ""
  _AUTH_EMAILS: ""
  # The assistant, on an API anyone can reach. The secret is named here so the public deployment
  # spends a key of its own (one with its own quota at the provider) and not the estate's
  # GEMINI_API_KEY, which hawanama's own API and ingest service run on.
  # The two caps are the code's defaults restated (api/pakemis_api/ask/limits.py) - and both are
  # counted IN MEMORY, PER INSTANCE: with max-instances 4 the daily ceiling is four times
  # _ASK_DAILY_TOKENS, and an instance that scales to zero starts its count again. The cap that
  # holds across instances is the provider's quota on the key, which is why the key is separable.
  _GEMINI_SECRET: PAKEMIS_GEMINI_API_KEY
  # That key lives in a project of its own (paqi-emissions-assistant, 2026-10), and a new project
  # cannot call the retired models the code falls back to by default: they answer 404, the chain
  # moves on a 404 and stays where it settles. So the fallbacks are ones THIS key reaches - checked
  # by asking the real assistant a data question on gemini-3.8-flash with it. `none` = no fallback.
  _ASK_FALLBACKS: gemini-3.8-flash
  _ASK_DAILY_TOKENS: "3000000"
  _ASK_PER_IP_PER_HOUR: "60"
  # WHERE the daily budget is counted. `firestore`: one document a day (in _ASK_BUDGET_COLLECTION
  # of this project's database) that every instance adds to, so _ASK_DAILY_TOKENS is the day's
  # total and not a per-instance, per-start allowance. Empty: each instance's own memory.
  _ASK_BUDGET_STORE: firestore
  _ASK_BUDGET_COLLECTION: explorer_ask_budget
  # The bot check on POST /ask (api/pakemis_api/appcheck.py): empty = off, `report` = verify and
  # log but answer regardless, `enforce` = refuse a question without a valid Firebase App Check
  # token. _APP_CHECK_PROJECT is the project NUMBER; _APP_CHECK_APPS narrows it to named app ids.
  # `enforce` since 2026-10-06: a question from the site's own page was logged `ok`, the same
  # request from a script `missing`, and no other reader had yet used the assistant to be locked out.
  _APP_CHECK: enforce
  _APP_CHECK_PROJECT: "152782825429"
  _APP_CHECK_APPS: 1:152782825429:web:4c8987e5eb65feca33bf5c
  # Addresses/CIDRs of the proxies in front of this service whose X-Forwarded-For hop is skipped
  # when the per-address limit picks its address (limits.client_address). Empty: the last hop.
  #
  # MEASURED 2026-10-05 on this service. Reached directly, the header is `<caller's own>, <caller>`.
  # Through Firebase Hosting it is `<caller>, <edge>`: Hosting REPLACES what the caller sent (a
  # forged entry, and a forged Fastly-Client-IP, both vanished) and the edge hop was a different
  # google-proxy address on every one of eight requests (66.249.93.x, 142.250.32.x). So with
  # nothing trusted the limit does not over-count Hosting's readers, it stops counting them: each
  # request lands in a new bucket. Those addresses are all in Google's published list of its own
  # fetch proxies (developers.google.com/static/search/apis/ipranges/user-triggered-fetchers-google.json,
  # 251 /27s that change), and the eight entries below are the goog.json blocks that cover that
  # whole list - Google's own space, none of it customer cloud (no overlap with cloud.json). A
  # caller who reaches run.app FROM that space could still forge the hop before theirs; the daily
  # budget is what bounds that. The `ask from` log line shows the chain if the edge ever moves.
  _TRUSTED_PROXIES: 64.233.160.0/19,66.102.0.0/20,66.249.64.0/19,74.125.0.0/16,142.250.0.0/15,172.253.0.0/16,192.178.0.0/15,2001:4860::/32

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'api/Dockerfile'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/pakemis:latest'
      - '.'
    env:
      - 'DOCKER_BUILDKIT=1'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/pakemis:latest'

  # Public read API (no partner key: the emissions API is public, read-only, receipt-bearing).
  # ^|^ makes | the list separator so _ALLOWED_ORIGINS may itself be a comma list.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'pakemis'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/pakemis:latest'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--set-secrets=GEMINI_API_KEY=${_GEMINI_SECRET}:latest'
      - '--set-env-vars=^|^PAKEMIS_RELEASES_BUCKET=${_RELEASES_BUCKET}|PAKEMIS_RELEASE_VERSION=${_RELEASE_VERSION}|ALLOWED_ORIGINS=${_ALLOWED_ORIGINS}|PAKEMIS_ASK_PROVIDER=gemini|PAKEMIS_REQUIRE_AUTH=${_REQUIRE_AUTH}|PAKEMIS_AUTH_PROJECT=${_AUTH_PROJECT}|PAKEMIS_AUTH_DOMAINS=${_AUTH_DOMAINS}|PAKEMIS_AUTH_EMAILS=${_AUTH_EMAILS}|PAKEMIS_ASK_DAILY_TOKENS=${_ASK_DAILY_TOKENS}|PAKEMIS_ASK_PER_IP_PER_HOUR=${_ASK_PER_IP_PER_HOUR}|PAKEMIS_TRUSTED_PROXIES=${_TRUSTED_PROXIES}|PAKEMIS_ASK_BUDGET_STORE=${_ASK_BUDGET_STORE}|PAKEMIS_ASK_BUDGET_COLLECTION=${_ASK_BUDGET_COLLECTION}|PAKEMIS_APP_CHECK=${_APP_CHECK}|PAKEMIS_APP_CHECK_PROJECT=${_APP_CHECK_PROJECT}|PAKEMIS_APP_CHECK_APPS=${_APP_CHECK_APPS}|PAKEMIS_ASK_FALLBACKS=${_ASK_FALLBACKS}'
      - '--cpu=2'
      - '--memory=2Gi'
      - '--concurrency=20'
      - '--timeout=300'
      # Keep one instance warm (2026-10-14, the operator's call) to reduce the wait after idle
      # periods. Startup was measured at about 35 s: 6 s to pull the payload, 12 s to verify its
      # digests, and 15 s to load the release and listen. A warm instance adds ongoing hosting cost.
      - '--min=1'
      - '--max-instances=4'

options:
  machineType: 'E2_HIGHCPU_8'
