# api + web. The API image (api/Dockerfile, built from the repository root) carries the vendored
# query core; the fetched release is mounted read-only, never copied into the image. No database,
# no auth; the agent runs only when GEMINI_API_KEY / ANTHROPIC_API_KEY is in the api's environment.
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      PAKEMIS_RELEASES_ROOT: /app/data/releases
      PAKEMIS_RECEIPT_STORE: /app/data/receipts.json
      ALLOWED_ORIGINS: "*"
    volumes:
      - ./data/releases:/app/data/releases:ro
    ports: ["8080:8080"]
  web:
    build:
      context: ./web
      args:
        # the static export inlines the API base at build time (web/Dockerfile ARG), so it is a
        # build arg, not a runtime variable: the api service above, prefix included, as the browser reaches it
        NEXT_PUBLIC_API_BASE: http://localhost:8080/api/v1/emissions
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  receipts:
