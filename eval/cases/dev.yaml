- id: D35
  topic: data_access
  question: can i get the underlying activity data on which this repo is made?
  # asked with a province selected on the map: a question about getting the data is not about the view
  ui_state: {level: adm1, geo: Khyber Pakhtunkhwa, period: FY2023-24, metric: greenhouse_gases}
  assumes: {scope: the release as a whole}
  reference: >
    Yes: the activity records the estimates are calculated from (vehicle registrations, livestock,
    crop areas, fuel sales, power generation and the rest) are downloadable as CSV files, with
    their sources and definitions, from the "The activity behind the estimates" section of the
    Downloads page - linked, not described. The assistant can also fetch a single figure. The
    answer is not about Khyber Pakhtunkhwa.
  truth:
    pointer: "web/src/components/downloads/catalogue.ts: collection 'activity', 'The activity behind the estimates'"
  checks:
    must_links: ["downloads:activity"]
    must_phrases_any: ["the activity behind the estimates"]
    forbid_phrases: [khyber]
    axes: [format]

- id: D36
  topic: data_access
  question: How many vehicles are registered in Lahore, by class?
  assumes: {table: fact_activity_vehicles, location: Lahore, measure: Registered vehicles, period: the register's newest date}
