# --------------------------------------- sums, breakdowns and changes (2026-11, the agent adds up)
# The agent writes its own figures and adds rows up on the server (add_up, calculate). Each truth is
# the query core's own sum: query_activity with `total` true, its last cell (derived: sum).
- id: D39
  topic: activity_sums
  question: How many vehicles are registered in Punjab, broken down by class?
  assumes: {table: fact_activity_vehicles, location: Punjab (its districts), measure: Registered vehicles, period: Punjab's newest register}
  reference: >
    The sum over Punjab's districts at its newest register date, with one figure per vehicle class
    (two-wheelers by far the largest), as a table or a chart, the date and the qualification that a
    register counts a registered stock named once. The figures are sums of the district rows.
  truth:
    values:
      total: {request: {type: QueryActivity, table: fact_activity_vehicles, measure: Registered vehicles, locations: [Punjab], total: true}, where: {derived: sum}}
      two_wheelers: {request: {type: QueryActivity, table: fact_activity_vehicles, measure: Registered vehicles, locations: [Punjab], categories: ["Two-wheelers (2W)"], total: true}, where: {derived: sum}}
      cars: {request: {type: QueryActivity, table: fact_activity_vehicles, measure: Registered vehicles, locations: [Punjab], categories: ["Small cars (4W1)"], total: true}, where: {derived: sum}}
  checks:
    must: [total, two_wheelers, cars]
    axes: [numeric, source]

- id: D40
  topic: activity_sums
  question: Which province has the most registered vehicles, and how many does each province have?
  assumes: {table: fact_activity_vehicles, scope: every province, each at its own newest register}
  reference: >
    Punjab, by far; then each province's sum of its districts, each figure beside its own register
    date (the dates differ). A combined figure is optional; if given, it is labelled as adding
    registers of different dates.
  truth:
    values:
