      kp: {request: {type: QueryActivity, table: fact_activity_vehicles, measure: Registered vehicles, locations: [Khyber Pakhtunkhwa], total: true}, where: {derived: sum}}
      sindh: {request: {type: QueryActivity, table: fact_activity_vehicles, measure: Registered vehicles, locations: [Sindh], total: true}, where: {derived: sum}}
  checks:
    must: [punjab, kp, sindh]
    must_phrases_all: [punjab]
    axes: [numeric, source]

