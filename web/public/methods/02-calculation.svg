  <g id="m02-scene-captions" font-size="19" text-anchor="middle" class="muted"><text x="156" y="372" class="muted">Public statistics</text><text x="501" y="372" class="muted">IPCC method</text><text x="824" y="372" class="muted">Resulting estimate</text></g>
