<svg xmlns="http://www.w3.org/2000/svg" id="m02-scene" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="m02-title m02-desc">
  <title id="m02-title">A livestock example: activity multiplied by an emission factor</title>
  <desc id="m02-desc">A cow and calf represent livestock numbers from public statistics. Multiplication by methane per animal from an IPCC method produces estimated methane, shown in a pale pink cloud. The scene is illustrative, with no numerical result implied.</desc>
  <defs>
    <filter id="m02-shadow" x="-15%" y="-15%" width="140%" height="145%"><feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/><feOffset in="blur" dy="2" result="offset"/><feFlood flood-color="#64192D" flood-opacity=".075" result="color"/><feComposite in="color" in2="offset" operator="in" result="shadow"/><feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="m02-paper"><stop stop-color="#FFFEFD"/><stop offset="1" stop-color="#F5F1ED"/></linearGradient>
    <linearGradient id="m02-cloud" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F6E9E7"/><stop offset="1" stop-color="#F1DFDE"/></linearGradient>
    <style>#m02-scene text{font-family:Arial,Helvetica,sans-serif;fill:#342B2E}#m02-scene .muted{fill:#807880}#m02-scene .animal-line{stroke:#754331;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
