<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="m04-title m04-desc">
<title id="m04-title">Sector records become national totals</title><desc id="m04-desc">Illustrative sector cards for agriculture, power and transport combine into a national greenhouse-gas total in carbon-dioxide equivalents. PM2.5, nitrogen oxides and sulphur dioxide each retain separate pollutant totals. No quantitative shares are implied.</desc>
