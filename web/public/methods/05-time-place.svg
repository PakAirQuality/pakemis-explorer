<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" fill="none" role="img" aria-labelledby="m05-title m05-desc">
<title id="m05-title">Same annual total, finer detail</title><desc id="m05-desc">A single annual record branches into twelve months, July to June, and a Pakistan map with a magnified grid. An illustrative key distinguishes reported detail, proxy allocation and no data or outside-area cells. No quantitative values are shown.</desc>
<metadata>Native vector reconstruction of the supplied PakEmis mock-up. Simplified Natural Earth public-domain country outline; schematic fills are illustrative, not administrative boundaries or measured data.</metadata>
