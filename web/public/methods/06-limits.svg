<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" fill="none" role="img" aria-labelledby="m06-title m06-desc">
  <title id="m06-title">Uncertainty and coverage</title>
  <desc id="m06-desc">An illustrative uncertainty interval surrounds an estimate. Separate coverage symbols distinguish categories estimated and included in the total, not estimated because of a data gap, and outside the inventory's scope. Uncertainty and coverage answer different questions.</desc>
  <defs>
    <pattern id="m06-hatching" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <rect width="7" height="7" fill="#FFF8EB"/>
      <path d="M0 0V7" stroke="#CCAA93" stroke-width="2"/>
    </pattern>
  </defs>
  <g id="m06-surface">
    <rect x="18" y="31" width="924" height="361" rx="17" fill="#FDFBF8"/>
    <path d="M464 66V319" stroke="#E8DED2" stroke-width="1.4" stroke-dasharray="9 6"/>
  </g>
  <g id="m06-uncertainty" font-family="Arial, Helvetica, sans-serif">
    <text x="53" y="83" fill="#64192D" font-size="21" font-weight="600" letter-spacing="-0.45">Uncertainty around an estimate</text>
    <g id="m06-interval" stroke="#64192D" stroke-width="2.8" stroke-linecap="round">
      <path d="M82 203H388"/>
      <path d="M82 187V219M388 187V219"/>
    </g>
    <circle id="m06-estimate-dot" cx="235" cy="203" r="13" fill="#64192D"/>
    <text x="235" y="250" text-anchor="middle" fill="#64192D" font-size="19" font-weight="500">Estimate</text>
    <g id="m06-range-bracket" stroke="#CAC4BC" stroke-width="1.3" stroke-linecap="round">
      <path d="M82 238V273H388V238M235 273V282"/>
    </g>
    <text x="235" y="304" text-anchor="middle" fill="#807880" font-size="17">Uncertainty range</text>
  </g>
  <g id="m06-coverage" font-family="Arial, Helvetica, sans-serif">
    <text x="533" y="83" fill="#64192D" font-size="21" font-weight="600" letter-spacing="-0.45">Coverage of categories</text>
    <g id="m06-estimated">
      <rect x="535" y="117" width="40" height="44" rx="3" fill="#64192D" stroke="#8A5E67" stroke-width="1.5"/>
      <text x="603" y="145" fill="#807880" font-size="18">Estimated (included in total)</text>
    </g>
    <g id="m06-not-estimated">
      <rect x="535" y="178" width="40" height="44" rx="3" fill="url(#m06-hatching)" stroke="#9B6A6D" stroke-width="2"/>
      <text x="603" y="206" fill="#807880" font-size="18">Not estimated (data gap)</text>
    </g>
    <g id="m06-outside-scope">
      <rect x="535" y="239" width="40" height="44" rx="3" fill="#FDFBF8" stroke="#9B6A6D" stroke-width="2"/>
      <text x="603" y="257" fill="#807880" font-size="18">
        <tspan x="603" dy="0">Outside scope</tspan>
        <tspan x="603" dy="24">(not part of inventory)</tspan>
      </text>
    </g>
  </g>
  <g id="m06-caption" font-family="Arial, Helvetica, sans-serif" fill="#807880">
    <text x="480" y="365" text-anchor="middle" font-size="17">Uncertainty and coverage answer different questions.</text>
    <text x="938" y="417" text-anchor="end" font-size="12">Illustrative example</text>
  </g>
</svg>
